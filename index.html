<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSA Orbit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="DSA Orbit — practice missions for Data Structures and Applications (1BAI303) by Prof Aman Kumar, DSCE.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* DSA Orbit — black + neon-green mission console.
   Layout: full-bleed 3D orbit behind everything; one left-aligned content column (max 1120px);
   the quiz narrows to a 820px flight deck. Deliberately single-theme (dark), all colours set explicitly. */
:root {
  --void: #000000;          /* true black space */
  --hull: #06100a;          /* panel base */
  --hull-2: #0b1a11;        /* raised panel */
  --grid: rgba(80, 255, 150, 0.16);
  --grid-strong: rgba(80, 255, 150, 0.38);
  --neon: #32ff7e;          /* primary neon green */
  --neon-deep: #12c45a;
  --lime: #c6ff3d;          /* second series / streaks */
  --ink: #e4ffee;
  --dim: #86ad96;
  --faint: #4d6e5a;
  --bad: #ff4f6e;
  --warn: #ffd23f;
  --glow: 0 0 18px rgba(50, 255, 126, 0.45), 0 0 2px rgba(50, 255, 126, 0.9);
  --f-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--void); }
body {
  margin: 0; min-height: 100vh; background: var(--void); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; }
a { color: var(--neon); }
::selection { background: var(--neon); color: #001a0a; }
:focus-visible { outline: 2px solid var(--neon); outline-offset: 3px; border-radius: 6px; }
[hidden] { display: none !important; }

/* ---------- 3D space layer ---------- */
#space { position: fixed; inset: 0; z-index: 0; pointer-events: none; transition: opacity 0.8s ease, filter 0.8s ease; }
#space canvas { width: 100% !important; height: 100% !important; display: block; }
body.dim-space #space { opacity: 0.38; filter: blur(1px); }
.vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse at 30% 40%, transparent 0%, rgba(0,0,0,0.35) 60%, rgba(0,0,0,0.85) 100%); }

/* ---------- shell ---------- */
.shell { position: relative; z-index: 2; }
.wrap { max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; backdrop-filter: blur(10px);
  background: linear-gradient(to bottom, rgba(0,0,0,0.92), rgba(0,0,0,0.55)); border-bottom: 1px solid var(--grid); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: #000; }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand-mark { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--neon); box-shadow: var(--glow);
  display: grid; place-items: center; position: relative; }
.brand-mark::after { content: ""; position: absolute; width: 44px; height: 12px; border: 1px solid var(--lime); border-radius: 50%; transform: rotate(-24deg); opacity: 0.8; }
.brand-mark i { width: 8px; height: 8px; border-radius: 50%; background: var(--neon); }
.brand b { font-family: var(--f-display); font-size: 20px; letter-spacing: 0.02em; }
.brand span { color: var(--dim); font-size: 13px; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav button { background: transparent; border: 1px solid transparent; color: var(--dim); padding: 7px 12px; border-radius: 999px; cursor: pointer; font-size: 14.5px; }
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { color: var(--neon); border-color: var(--grid-strong); background: rgba(50,255,126,0.06); }

/* ---------- type ---------- */
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
.display { font-size: clamp(44px, 8.6vw, 104px); line-height: 0.92; font-weight: 700; letter-spacing: -0.01em;
  color: var(--ink); text-shadow: 0 0 40px rgba(50,255,126,0.25); }
.display .ring { color: transparent; -webkit-text-stroke: 1.5px var(--neon); text-shadow: none; }
h2 { font-size: clamp(24px, 3.4vw, 34px); line-height: 1.12; }
h3 { font-size: 19px; line-height: 1.25; }
.lede { color: var(--dim); font-size: 17.5px; max-width: 58ch; margin: 0; }
.muted { color: var(--dim); }
.tiny { font-size: 13px; color: var(--dim); }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }

/* ---------- launch / hero ---------- */
.hero { min-height: min(86vh, 780px); display: grid; align-items: center; padding-block: 48px 24px; }
.hero-inner { display: flex; flex-direction: column; gap: 22px; max-width: 640px; }
.credit { display: flex; align-items: center; gap: 12px; color: var(--dim); font-size: 15px; }
.credit strong { color: var(--ink); font-weight: 600; }
.credit .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--neon); box-shadow: var(--glow); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; transform: scale(0.8); } }
.hero-stats { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 4px; }
.hero-stats div { display: flex; flex-direction: column; }
.hero-stats .num { font-size: 34px; color: var(--neon); line-height: 1; text-shadow: var(--glow); }
.hero-stats span:last-child { color: var(--dim); font-size: 13.5px; margin-top: 4px; }
.cta-row { display: flex; gap: 12px; flex-wrap: wrap; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border-radius: 12px;
  padding: 12px 20px; font-weight: 700; font-size: 15.5px; border: 1px solid var(--grid-strong); background: rgba(6,16,10,0.75); color: var(--ink);
  transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease; }
.btn:hover { border-color: var(--neon); box-shadow: 0 0 0 1px rgba(50,255,126,0.25), 0 8px 26px rgba(50,255,126,0.15); }
.btn:active { transform: translateY(1px) scale(0.99); }
.btn.primary { background: var(--neon); color: #00170a; border-color: var(--neon); box-shadow: var(--glow); }
.btn.primary:hover { background: #5cff99; }
.btn.ghost { background: transparent; }
.btn.danger { border-color: rgba(255,79,110,0.6); color: var(--bad); }
.btn.small { padding: 8px 13px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

/* ---------- panels ---------- */
.panel { background: linear-gradient(160deg, rgba(11,26,17,0.86), rgba(4,10,6,0.9)); border: 1px solid var(--grid);
  border-radius: 18px; padding: 22px; backdrop-filter: blur(6px); position: relative; }
.panel.glow { border-color: var(--grid-strong); box-shadow: 0 0 0 1px rgba(50,255,126,0.06), 0 30px 80px rgba(0,0,0,0.6); }
section.block { padding-block: 34px; display: flex; flex-direction: column; gap: 18px; }
.section-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.section-head p { margin: 6px 0 0; }

/* ---------- 3D tilt cards (missions) ---------- */
.missions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; perspective: 1100px; }
@media (max-width: 900px) { .missions { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .missions { grid-template-columns: 1fr; } }
.mission { position: relative; text-align: left; cursor: pointer; border-radius: 18px; padding: 20px; min-height: 172px;
  border: 1px solid var(--grid); background: linear-gradient(150deg, rgba(14,34,22,0.92), rgba(3,8,5,0.95));
  transform-style: preserve-3d; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform 0.18s ease-out, border-color 0.2s, box-shadow 0.2s;
  display: flex; flex-direction: column; gap: 10px; overflow: hidden; color: var(--ink); }
.mission:hover { border-color: var(--neon); box-shadow: 0 22px 60px rgba(0,0,0,0.7), 0 0 30px rgba(50,255,126,0.18); }
.mission::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background: radial-gradient(circle at var(--gx, 50%) var(--gy, 0%), rgba(50,255,126,0.22), transparent 55%); opacity: 0; transition: opacity 0.2s; }
.mission:hover::after { opacity: 1; }
.mission h3 { transform: translateZ(30px); }
.mission p { margin: 0; color: var(--dim); font-size: 14.5px; transform: translateZ(18px); }
.mission .meta { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; transform: translateZ(24px); }
.mission .glyph { position: absolute; right: -18px; top: -18px; width: 96px; height: 96px; border-radius: 50%;
  border: 1px solid var(--grid-strong); opacity: 0.5; transform: translateZ(-20px); }
.mission .glyph::before { content: ""; position: absolute; inset: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--neon), var(--neon-deep) 45%, #013b18 80%); box-shadow: 0 0 22px rgba(50,255,126,0.5); }
.pill { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--grid-strong); color: var(--neon); background: rgba(50,255,126,0.06); white-space: nowrap; }
.pill.lime { color: var(--lime); border-color: rgba(198,255,61,0.4); background: rgba(198,255,61,0.06); }
.pill.dim { color: var(--dim); border-color: var(--grid); background: transparent; }

/* ---------- planets (module selector) ---------- */
.planets { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .planets { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 420px) { .planets { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.planet { cursor: pointer; border: 1px solid var(--grid); border-radius: 16px; background: rgba(4,10,6,0.8); padding: 14px 10px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; color: var(--ink); transition: border-color 0.2s, background 0.2s; }
.planet .orb { width: 62px; height: 62px; border-radius: 50%; position: relative; transform-style: preserve-3d;
  background: radial-gradient(circle at 34% 30%, #3a4a40, #121a15 55%, #030503 80%); box-shadow: inset -8px -10px 18px rgba(0,0,0,0.8); transition: background 0.3s, box-shadow 0.3s; }
.planet .orb::after { content: ""; position: absolute; left: -16px; right: -16px; top: 24px; height: 14px; border-radius: 50%;
  border: 1.5px solid var(--faint); transform: rotate(-18deg); transition: border-color 0.3s; }
.planet .orb b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: 20px; color: var(--dim); }
.planet[aria-pressed="true"] { border-color: var(--neon); background: rgba(50,255,126,0.07); }
.planet[aria-pressed="true"] .orb { background: radial-gradient(circle at 34% 30%, #b7ffd2, var(--neon) 30%, var(--neon-deep) 58%, #012d12 88%); box-shadow: 0 0 26px rgba(50,255,126,0.55), inset -8px -10px 18px rgba(0,30,10,0.7); }
.planet[aria-pressed="true"] .orb::after { border-color: var(--lime); animation: tilt 6s linear infinite; }
.planet[aria-pressed="true"] .orb b { color: #00230e; }
@keyframes tilt { 0% { transform: rotate(-18deg) scaleY(1); } 50% { transform: rotate(-12deg) scaleY(0.7); } 100% { transform: rotate(-18deg) scaleY(1); } }
.planet .t { font-size: 13.5px; line-height: 1.25; font-weight: 600; }
.planet .c { font-size: 12px; color: var(--dim); }

/* ---------- chips & controls ---------- */
.builder { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 860px) { .builder { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 10px; }
.field-label { font-size: 14px; color: var(--dim); font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { cursor: pointer; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--grid); background: rgba(4,10,6,0.85); color: var(--dim); font-size: 14px; display: inline-flex; gap: 7px; align-items: center; }
.chip .n { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.chip:hover { color: var(--ink); border-color: var(--grid-strong); }
.chip[aria-pressed="true"] { color: #00230e; background: var(--neon); border-color: var(--neon); font-weight: 700; }
.chip[aria-pressed="true"] .n { color: #0a4a22; }
.seg { display: inline-flex; border: 1px solid var(--grid-strong); border-radius: 12px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--dim); padding: 9px 14px; cursor: pointer; font-size: 14.5px; }
.seg button + button { border-left: 1px solid var(--grid); }
.seg button[aria-pressed="true"] { background: rgba(50,255,126,0.14); color: var(--neon); font-weight: 700; }
.toggle { display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 14.5px; color: var(--ink); }
.toggle input { appearance: none; width: 42px; height: 24px; border-radius: 999px; background: #18261d; border: 1px solid var(--grid-strong); position: relative; cursor: pointer; flex: none; margin: 0; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--dim); transition: transform 0.2s, background 0.2s; }
.toggle input:checked { background: rgba(50,255,126,0.25); border-color: var(--neon); }
.toggle input:checked::after { transform: translateX(18px); background: var(--neon); box-shadow: var(--glow); }
.toggle small { display: block; color: var(--dim); font-size: 12.5px; }
input[type="range"] { width: 100%; accent-color: var(--neon); }
.launch-bar { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; padding-top: 6px; border-top: 1px dashed var(--grid); }
.launch-bar .count .num { font-size: 30px; color: var(--neon); }
.namebox { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.namebox input { background: rgba(0,0,0,0.6); border: 1px solid var(--grid-strong); border-radius: 10px; padding: 9px 12px; min-width: 0; flex: 1 1 180px; }

/* ---------- quiz deck ---------- */
.deck { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; padding-block: 24px 60px; }
.hud { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; }
.hud .ringbox { width: 58px; height: 58px; position: relative; }
.hud .ringbox svg { width: 58px; height: 58px; transform: rotate(-90deg); }
.hud .ringbox .lbl { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: 14px; }
.hud .bar { height: 6px; background: #0e1f14; border-radius: 6px; overflow: hidden; }
.hud .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--neon-deep), var(--neon)); box-shadow: var(--glow); transition: width 0.35s ease; }
.hud .meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: 13.5px; color: var(--dim); }
.hud .meta b { color: var(--ink); font-variant-numeric: tabular-nums; }
.hud-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.timer { font-family: var(--f-display); font-size: 20px; font-variant-numeric: tabular-nums; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--grid-strong); color: var(--neon); }
.timer.low { color: var(--bad); border-color: var(--bad); animation: pulse 1s infinite; }
.streak { font-family: var(--f-display); color: var(--lime); font-size: 15px; padding: 6px 10px; border-radius: 10px; border: 1px solid rgba(198,255,61,0.35); }
.qcard-stage { perspective: 1400px; }
.qcard { transform-origin: 50% 0; animation: flipIn 0.5s cubic-bezier(.2,.8,.2,1); }
@keyframes flipIn { from { opacity: 0; transform: rotateX(-14deg) translateY(18px) translateZ(-60px); } to { opacity: 1; transform: none; } }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.qno { font-family: var(--f-display); color: var(--dim); font-size: 15px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.qtext { font-size: 18.5px; line-height: 1.55; margin: 12px 0 0; }
.qtext code { font-family: var(--f-code); font-size: 0.88em; background: #0b1b11; border: 1px solid var(--grid); padding: 1px 6px; border-radius: 6px; color: var(--lime); }
pre.code { margin: 14px 0 0; padding: 14px 16px; background: #020604; border: 1px solid var(--grid); border-left: 3px solid var(--neon); border-radius: 12px;
  font-family: var(--f-code); font-size: 13.8px; line-height: 1.6; overflow-x: auto; color: #cfe9d8; white-space: pre; }
pre.code .kw { color: var(--neon); } pre.code .ty { color: #7fe7ff; } pre.code .st { color: #ffcf6e; } pre.code .nu { color: var(--lime); }
pre.code .cm { color: #5f8a70; font-style: italic; } pre.code .pp { color: #ff8ad8; }
.graphfig { margin-top: 14px; display: flex; justify-content: center; overflow-x: auto; }
.graphfig svg { max-width: 100%; height: auto; }
.opts { display: grid; gap: 10px; margin-top: 18px; perspective: 900px; }
.opt { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; text-align: left; width: 100%; cursor: pointer;
  border: 1px solid var(--grid); background: rgba(3,9,5,0.85); border-radius: 14px; padding: 12px 14px; color: var(--ink); font-size: 16px;
  transition: transform 0.15s ease, border-color 0.15s, background 0.15s; min-width: 0; }
.opt:hover:not([disabled]) { border-color: var(--neon); transform: translateZ(14px) rotateX(2deg); }
.opt .k { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; border: 1px solid var(--grid-strong); font-family: var(--f-display); color: var(--neon); font-size: 15px; }
.opt .t { min-width: 0; overflow-wrap: anywhere; padding-top: 3px; }
.opt.mono .t { font-family: var(--f-code); font-size: 14.5px; white-space: pre-wrap; }
.opt.sel { border-color: var(--neon); background: rgba(50,255,126,0.1); }
.opt.sel .k { background: var(--neon); color: #00230e; }
.opt.right { border-color: var(--neon); background: rgba(50,255,126,0.14); box-shadow: 0 0 24px rgba(50,255,126,0.22); }
.opt.right .k { background: var(--neon); color: #00230e; }
.opt.wrong { border-color: var(--bad); background: rgba(255,79,110,0.1); }
.opt.wrong .k { background: var(--bad); color: #24000a; border-color: var(--bad); }
.opt[disabled] { cursor: default; }
.typed { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.typed input { flex: 1 1 220px; min-width: 0; background: #020604; border: 1px solid var(--grid-strong); border-radius: 12px; padding: 12px 14px; font-family: var(--f-code); font-size: 16px; color: var(--lime); }
.feedback { margin-top: 16px; border-radius: 14px; padding: 14px 16px; border: 1px solid var(--grid); background: rgba(0,0,0,0.55); animation: flipIn 0.35s ease; }
.feedback .v { font-family: var(--f-display); font-size: 18px; margin-bottom: 6px; }
.feedback .v.ok { color: var(--neon); } .feedback .v.bad { color: var(--bad); }
.feedback .src { margin-top: 8px; font-size: 13px; color: var(--faint); }
.deck-actions { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.deck-actions .grp { display: flex; gap: 8px; flex-wrap: wrap; }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.palette button { height: 36px; border-radius: 9px; border: 1px solid var(--grid); background: rgba(3,9,5,0.85); color: var(--dim); cursor: pointer; font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.palette button.ans { color: #00230e; background: var(--neon); border-color: var(--neon); }
.palette button.rev { color: #2a2200; background: var(--warn); border-color: var(--warn); }
.palette button.cur { outline: 2px solid var(--lime); outline-offset: 2px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--dim); margin-top: 10px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid var(--grid-strong); }
.keys { font-size: 13px; color: var(--faint); text-align: center; }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,79,110,0.5); background: rgba(255,79,110,0.08); }

/* ---------- analysis ---------- */
.result-hero { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
@media (max-width: 640px) { .result-hero { grid-template-columns: 1fr; justify-items: start; } }
.bigring { width: 180px; height: 180px; position: relative; perspective: 600px; }
.bigring svg { width: 180px; height: 180px; transform: rotateX(18deg) rotate(-90deg); filter: drop-shadow(0 0 14px rgba(50,255,126,0.45)); }
.bigring .lbl { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.bigring .lbl .num { font-size: 46px; line-height: 1; color: var(--neon); }
.statgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .statgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { border: 1px solid var(--grid); border-radius: 14px; padding: 12px 14px; background: rgba(0,0,0,0.45); }
.stat .num { font-size: 26px; color: var(--ink); display: block; line-height: 1.1; }
.stat span:last-child { font-size: 13px; color: var(--dim); }
.charts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 860px) { .charts { grid-template-columns: 1fr; } }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--dim); font-family: var(--f-body); font-size: 12px; }
.chart .v { fill: var(--ink); font-family: var(--f-display); font-size: 13px; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.brow { display: grid; grid-template-columns: minmax(110px, 190px) 1fr 64px; gap: 12px; align-items: center; font-size: 14px; }
.brow .track { height: 12px; border-radius: 6px; background: #0d1d13; overflow: hidden; }
.brow .track i { display: block; height: 100%; border-radius: 6px; }
.brow .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }
.insights { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.insights li { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--grid); background: rgba(0,0,0,0.45); display: grid; grid-template-columns: 10px 1fr; gap: 12px; }
.insights li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; background: var(--neon); box-shadow: var(--glow); }
.insights li.bad::before { background: var(--bad); box-shadow: 0 0 12px rgba(255,79,110,0.6); }
.insights li.warn::before { background: var(--warn); box-shadow: 0 0 12px rgba(255,210,63,0.5); }
.heat { display: grid; gap: 4px; overflow-x: auto; }
.heat .row { display: grid; grid-template-columns: 150px repeat(6, minmax(52px, 1fr)); gap: 4px; min-width: 520px; }
.heat .cell { border-radius: 8px; padding: 9px 4px; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; border: 1px solid var(--grid); }
.heat .hdr { font-size: 12.5px; color: var(--dim); text-align: center; padding: 4px; }
.heat .rh { font-size: 13.5px; text-align: left; padding: 9px 6px; color: var(--ink); }
.review { display: flex; flex-direction: column; gap: 12px; }
.rv { border: 1px solid var(--grid); border-radius: 14px; padding: 14px 16px; background: rgba(2,7,4,0.85); }
.rv.bad { border-left: 3px solid var(--bad); } .rv.ok { border-left: 3px solid var(--neon); } .rv.skip { border-left: 3px solid var(--faint); }
.rv .h { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.rv .q { margin: 8px 0 0; }
.rv .a { margin-top: 8px; font-size: 14.5px; }
.rv .a .y { color: var(--bad); } .rv .a .c { color: var(--neon); font-weight: 700; }
.rv .x { margin-top: 6px; color: var(--dim); font-size: 14.5px; }
.empty { padding: 26px; text-align: center; color: var(--dim); border: 1px dashed var(--grid-strong); border-radius: 16px; }
footer.foot { border-top: 1px solid var(--grid); padding-block: 22px 40px; color: var(--faint); font-size: 13.5px; }
footer.foot .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.field > .seg { align-self: flex-start; }
@media (max-width: 760px) {
  .hero { padding-top: 34vh; min-height: 0; }
  .hero-inner { text-shadow: 0 1px 12px #000, 0 0 2px #000; }
  .nav button { padding: 6px 10px; font-size: 14px; }
}
@media (max-width: 560px) {
  .hud { grid-template-columns: auto 1fr; }
  .hud-right { grid-column: 1 / -1; justify-content: flex-start; }
  .brow { grid-template-columns: 100px 1fr 52px; }
  .heat .row { grid-template-columns: 104px repeat(6, minmax(44px, 1fr)); min-width: 410px; }
  .heat .cell { padding: 8px 2px; font-size: 12px; }
  .qtext { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .mission { transform: none !important; }
}

  def("Recursion trace", 2, () => {

  def("Chaining", 3, () => {

  /* ===================== MODULE 4 ===================== */
  function bst(keys) {

  def("BST deletion", 4, () => {
    for (let g = 0; g < 200; g++) {

  });
  function avlBuild(keys) {

    }
    if (sks.length && sks[0].p < 0.7) {
      const tip = { trace: "Trace on paper: write each variable after every line before choosing.", num: "Write the formula first, then substitute. Most slips are off-by-one in the element count.", debug: "Check loop bounds, pointer updates and missing base cases first; they cause most bugs.", syntax: "Watch declarations: pointer placement, array parameters, semicolons in #define.", logic: "Before filling a blank, test it on the smallest input by hand.", concept: "Revisit the key-idea boxes and complexity cheat-sheet in the book." }[sks[0].k];
      out.push(["warn", `${SKILLS[sks[0].k]} questions are your weakest type (${Math.round(sks[0].p * 100)}%). ${tip}`]);
    }
    if (fastWrong >= 2) out.push(["warn", `${fastWrong} wrong answers came in under 10 seconds. Rushing is costing marks; take a moment on each one.`]);
    if (avg > 100) out.push(["warn", `Average ${Math.round(avg)} s per question. The CIA pace is about 90 s, so practise the numericals lab to get faster.`]);
    if (res.d[3] && res.d[1] && res.d[3].c / res.d[3].n > res.d[1].c / res.d[1].n) out.push(["ok", "You did better on Level 3 than Level 1. Check the basics you skipped past."]);
    if (res.skipped) out.push(["warn", `${res.skipped} question${res.skipped > 1 ? "s were" : " was"} left unanswered. In an MCQ exam an attempt never scores below a blank.`]);
    if (!out.length) out.push(["ok", "Solid and balanced. Keep a daily streak with a quick burst."]);
    return out;
  }
  function renderResult() {
    if (!RUN || !RUN.res) { setView("launch"); return; }
    const res = RUN.res, items = RUN.items, N = items.length, p = pct(res.correct, N), C = 2 * Math.PI * 78;
    const answered = items.filter((x) => x.ans !== undefined);
    const avg = answered.length ? answered.reduce((s, x) => s + x.time, 0) / answered.length : 0;
    const list = items.map((it, i) => ({ it, i, st: it.ans === undefined ? "skip" : isCorrect(it) ? "ok" : "bad" })).filter((x) => RUN.filter === "all" || x.st !== "ok");
    const ins = insights(res, items);
    const bars = (obj, label) => Object.entries(obj).sort((a, b) => a[0] - b[0]).map(([k, v]) => { const pp = pct(v.c, v.n); return `<div class="brow"><span>${label(k)}</span><span class="track"><i style="width:${pp}%;background:${accColor(pp)};box-shadow:0 0 10px ${accColor(pp)}"></i></span><span class="val">${v.c}/${v.n}</span></div>`; }).join("");
    app.innerHTML = `<div class="wrap" style="padding-block:28px 60px;display:flex;flex-direction:column;gap:18px">
      <div class="panel glow"><div class="result-hero">
        <div class="bigring"><svg viewBox="0 0 180 180"><circle cx="90" cy="90" r="78" fill="none" stroke="#0e1f14" stroke-width="12"/><circle cx="90" cy="90" r="78" fill="none" stroke="${accColor(p)}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p / 100)}"/></svg>
          <div class="lbl"><span class="num" style="color:${accColor(p)}">${p}%</span><span class="tiny">${res.correct} of ${N}</span></div></div>
        <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
          <div><h2>${esc(RUN.title)} complete</h2><p class="muted" style="margin:6px 0 0">${DB.name ? `Report for ${esc(DB.name)} · ` : ""}${new Date().toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })} · ${RUN.f.mode === "exam" ? "Timed test" : "Practice"}</p></div>
          <div class="statgrid">
            <div class="stat"><span class="num" style="color:var(--neon)">${res.correct}</span><span>Correct</span></div>
            <div class="stat"><span class="num" style="color:var(--bad)">${res.wrong}</span><span>Wrong</span></div>
            <div class="stat"><span class="num">${fmtT(res.time)}</span><span>Total time</span></div>
            <div class="stat"><span class="num">${Math.round(avg)}s</span><span>Per answered question</span></div>
          </div>
          <div class="cta-row">${res.wrong + res.skipped ? `<button class="btn primary" id="retryBtn">Retry the ${res.wrong + res.skipped} missed</button>` : ""}<button class="btn" id="againBtn">Same mission, new questions</button><button class="btn ghost" id="backBtn">Back to missions</button></div>
        </div></div></div>
      <div class="panel"><h3 style="margin-bottom:12px">What this mission says</h3><ul class="insights">${ins.map(([c, t]) => `<li class="${c}">${t}</li>`).join("")}</ul></div>
      <div class="charts">
        <div class="panel chart"><h3 style="margin-bottom:6px">Accuracy by question type</h3>${radarSVG(res.k)}</div>
        <div class="panel"><h3 style="margin-bottom:14px">Accuracy by module</h3><div class="bars">${bars(res.m, (k) => MODULES[k].short)}</div>
          <h3 style="margin:22px 0 14px">By difficulty and source</h3><div class="bars">${bars(res.d, (k) => LEVELS[k])}${bars(res.src, (k) => SOURCES[k])}</div></div>
      </div>
      <div class="panel chart"><h3 style="margin-bottom:6px">Time on each question</h3><p class="tiny" style="margin:0 0 8px">Green correct, red wrong, grey unanswered.</p>${timeSVG(items)}</div>
      <section style="display:flex;flex-direction:column;gap:12px">
        <div class="section-head"><h2>Review</h2><div class="seg"><button data-f="missed" aria-pressed="${RUN.filter === "missed"}">Missed only</button><button data-f="all" aria-pressed="${RUN.filter === "all"}">All questions</button></div></div>
        <div class="review">${list.length ? list.map(({ it, i, st }) => { const q = it.q; const yours = it.ans === "typed" ? it.typed : it.ans !== undefined ? q.o[it.ans] : null; return `<article class="rv ${st}">
          <div class="h"><span class="qno">Q${i + 1} · ${MODULES[q.m].short} · ${SKILLS[q.k]}</span><span class="pill ${st === "ok" ? "" : st === "bad" ? "dim" : "dim"}" style="${st === "bad" ? "color:var(--bad);border-color:rgba(255,79,110,.5)" : ""}">${st === "ok" ? "Correct" : st === "bad" ? "Wrong" : "Not answered"} · ${Math.round(it.time)} s</span></div>
          <div class="q">${q.q}</div>${q.code ? `<pre class="code">${highlight(q.code)}</pre>` : ""}${q.graph ? `<div class="graphfig">${graphSVG(q.graph)}</div>` : ""}
          <div class="a">${yours !== null && st !== "ok" ? `<div class="y">Your answer: ${esc(yours)}</div>` : ""}<div class="c">Correct: ${esc(q.o[q.a])}</div></div>
          <div class="x">${q.e}</div><div class="tiny" style="margin-top:6px;color:var(--faint)">${esc(q.ref || "")}</div></article>`; }).join("") : `<div class="empty">Nothing missed. Clean run.</div>`}</div>
      </section></div>`;
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    on("retryBtn", () => start(Object.assign({}, RUN.f, { title: "Retry: missed questions" }), items.filter((x) => !isCorrect(x)).map((x) => x.q)));
    on("againBtn", () => start(RUN.f));
    on("backBtn", () => { location.hash = "launch"; setView("launch"); scrollTo({ top: 0 }); setTimeout(() => $("#missions")?.scrollIntoView(), 30); });
    app.querySelectorAll("[data-f]").forEach((b) => (b.onclick = () => { RUN.filter = b.dataset.f; const y = scrollY; renderResult(); scrollTo({ top: y }); }));
  }

  /* ---------------- mission log ---------------- */
  function trendSVG(att) {
    const a = att.slice(0, 15).reverse(); const W = 520, H = 170, pad = 30;
    if (a.length < 2) return `<div class="empty">Finish two missions to see your trend.</div>`;
    const x = (i) => pad + ((W - pad - 10) * i) / (a.length - 1), y = (v) => H - 10 - (H - 30) * v;
    const pts = a.map((t, i) => [x(i), y(t.correct / t.total)]);
    let s = `<svg viewBox="0 0 ${W} ${H + 20}" role="img" aria-label="Accuracy over recent missions">`;
    [0, 0.5, 1].forEach((f) => (s += `<line x1="${pad}" x2="${W - 10}" y1="${y(f)}" y2="${y(f)}" stroke="rgba(80,255,150,0.12)"/><text x="${pad - 6}" y="${y(f) + 4}" text-anchor="end">${f * 100}%</text>`));
    s += `<path d="M${pts.map((p) => p.join(",")).join(" L")} L${pts[pts.length - 1][0]},${H - 10} L${pts[0][0]},${H - 10}Z" fill="rgba(50,255,126,0.1)"/>`;
    s += `<path d="M${pts.map((p) => p.join(",")).join(" L")}" fill="none" stroke="#32ff7e" stroke-width="2.2" style="filter:drop-shadow(0 0 5px rgba(50,255,126,.7))"/>`;
    pts.forEach((p, i) => (s += `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 5 : 3}" fill="${i === pts.length - 1 ? "#c6ff3d" : "#32ff7e"}"><title>${Math.round((100 * a[i].correct) / a[i].total)}%</title></circle>`));
    return s + `<text x="${pad}" y="${H + 16}">Older</text><text x="${W - 10}" y="${H + 16}" text-anchor="end">Latest</text></svg>`;
  }
  function renderLog() {
    const A = DB.attempts, tot = A.reduce((s, a) => s + a.total, 0), cor = A.reduce((s, a) => s + a.correct, 0);
    const best = A.length ? Math.max(...A.map((a) => pct(a.correct, a.total))) : 0;
    const cell = (m, k) => DB.cells[`${m}|${k}`];
    app.innerHTML = `<div class="wrap" style="padding-block:28px 60px;display:flex;flex-direction:column;gap:18px">
      <div class="section-head"><div><h2>Mission log</h2><p class="muted">Everything here is saved only in this browser.</p></div>
        <div class="namebox" style="max-width:420px"><input id="cadet2" placeholder="Your name for reports" value="${esc(DB.name || "")}" maxlength="40" aria-label="Your name"></div></div>
      <div class="statgrid">
        <div class="stat"><span class="num" style="color:var(--neon)">${A.length}</span><span>Missions flown</span></div>
        <div class="stat"><span class="num">${tot}</span><span>Questions answered</span></div>
        <div class="stat"><span class="num">${pct(cor, tot)}%</span><span>Overall accuracy</span></div>
        <div class="stat"><span class="num" style="color:var(--lime)">${best}%</span><span>Best mission</span></div>
      </div>
      <div class="panel"><h3 style="margin-bottom:6px">Mastery map</h3><p class="tiny" style="margin:0 0 12px">Accuracy for every module and question type you have attempted. Dark cells are not tried yet.</p>
        <div class="heat"><div class="row"><span></span>${Object.values(SKILLS).map((s) => `<span class="hdr">${s}</span>`).join("")}</div>
          ${Object.entries(MODULES).map(([m, M]) => `<div class="row"><span class="rh">${M.short}</span>${Object.keys(SKILLS).map((k) => { const c = cell(m, k); if (!c) return `<span class="cell" style="color:var(--faint)">–</span>`; const pp = pct(c.c, c.n); const bg = pp >= 75 ? `rgba(50,255,126,${0.15 + pp / 300})` : pp >= 50 ? "rgba(255,210,63,0.22)" : "rgba(255,79,110,0.22)"; return `<span class="cell" style="background:${bg};color:${pp >= 75 ? "#eafff1" : "var(--ink)"}" title="${c.c}/${c.n}">${pp}%</span>`; }).join("")}</div>`).join("")}
        </div></div>
      <div class="charts">
        <div class="panel chart"><h3 style="margin-bottom:10px">Accuracy trend</h3>${trendSVG(A)}</div>
        <div class="panel"><h3 style="margin-bottom:12px">Recent missions</h3>${A.length ? `<div class="bars">${A.slice(0, 8).map((a) => { const pp = pct(a.correct, a.total); return `<div class="brow"><span title="${esc(a.title)}">${new Date(a.at).toLocaleDateString(undefined, { day: "numeric", month: "short" })} · ${esc(a.title)}</span><span class="track"><i style="width:${pp}%;background:${accColor(pp)}"></i></span><span class="val">${a.correct}/${a.total}</span></div>`; }).join("")}</div>` : `<div class="empty">No missions yet. Start a quick burst from the launch screen.</div>`}</div>
      </div>
      <div class="panel" style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
        <div><h3>Start over</h3><p class="tiny" style="margin:4px 0 0">Clears missions, the mastery map and seen questions on this device.</p></div>
        <div id="resetBox"><button class="btn danger" id="resetBtn">Reset progress</button></div>
      </div></div>`;
    $("#cadet2").oninput = (e) => { DB.name = e.target.value.trim(); save(); };
    $("#resetBtn").onclick = () => {
      $("#resetBox").innerHTML = `<div class="cta-row"><button class="btn danger" id="resetYes">Yes, clear everything</button><button class="btn" id="resetNo">Cancel</button></div>`;
      $("#resetYes").onclick = () => { DB.attempts = []; DB.cells = {}; DB.seen = {}; save(); renderLog(); };
      $("#resetNo").onclick = renderLog;
    };
  }

  /* ---------------- boot ---------------- */
  window.addEventListener("hashchange", () => {
    const h = location.hash.replace("#", "");
    if ((h === "launch" || h === "log") && VIEW !== h && !(VIEW === "deck" && RUN && !RUN.done)) setView(h);
  });
  const start0 = location.hash.replace("#", "");
  setView(start0 === "log" ? "log" : "launch");
  if (start0 === "missions") setTimeout(() => $("#missions")?.scrollIntoView(), 50);
})();

</script>
</body>
</html>
